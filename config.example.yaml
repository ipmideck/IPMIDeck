server:
  host: 0.0.0.0
  port: 3000
  https: false
  # cert_file: /path/to/cert.pem
  # key_file: /path/to/key.pem

auth:
  # Whether authentication is on, and the lockout thresholds, are NOT configured here.
  # Authentication is switched on or off from the Security settings and the answer is kept
  # in the database, so a file with write access cannot be used to turn the login off.
  session_expiry: 24h

ipmi:
  poll_interval: 30           # seconds
  power_poll_interval: 30     # seconds
  command_timeout: 30         # seconds

data:
  retention_days: 365
  cleanup_interval: 24h

logging:
  level: info                 # debug, info, warning, error

modules:
  sensors:
    enabled: true
  fanpilot:
    enabled: true
  power:
    enabled: true
  sel:
    enabled: true
  fru:
    enabled: true
