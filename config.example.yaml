server:
  host: 0.0.0.0
  port: 3000
  https: false
  # cert_file: /path/to/cert.pem
  # key_file: /path/to/key.pem

auth:
  enabled: true
  session_expiry: 24h
  max_login_attempts: 5

ipmi:
  poll_interval: 5            # seconds
  power_poll_interval: 10     # seconds
  command_timeout: 10         # seconds

data:
  retention_days: 365
  cleanup_interval: 24h

logging:
  level: info                 # debug, info, warning, error

updates:
  # Master switch for the update check. With this false IPMIDeck never opens a socket to look up
  # a published version: the check endpoint is not registered and the periodic check is not
  # started, whatever was answered during setup. Leaving it true does NOT by itself make the app
  # check — an unattended check also needs the opt-in from the setup wizard (or the Updates
  # toggle in Settings). The on-demand button and the console update key are explicit requests
  # and work whenever this is true.
  # Environment override: IPMIDECK_UPDATES_ENABLED=false
  enabled: true

modules:
  sensors:
    enabled: true
  fanpilot:
    enabled: true
  power:
    enabled: true
  sel:
    enabled: true
  fru:
    enabled: true
