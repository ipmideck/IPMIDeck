server:
  host: 0.0.0.0
  port: 3000
  # Serve over HTTPS. With no cert_file/key_file set, a self-signed certificate is
  # created under <data_dir>/certs/ on the first start and used automatically.
  # Browsers will warn that the issuer is unknown — see the README for how to import
  # it, or point the two settings below at your own certificate.
  # Env: IPMIDECK_SERVER_HTTPS / IPMIDECK_SERVER_CERT_FILE / IPMIDECK_SERVER_KEY_FILE
  https: false
  # cert_file: /path/to/cert.pem
  # key_file: /path/to/key.pem

  # --- only needed behind a reverse proxy ---
  # Which peers may set X-Forwarded-Proto / X-Forwarded-For. Only 127.0.0.1 is trusted by
  # default, so a TLS proxy in another container is ignored and the session cookie loses its
  # Secure flag. Set it to the proxy's address.
  # forwarded_allow_ips: "172.18.0.0/16"
  #
  # The external addresses the dashboard is reached at. Only needed when the proxy does not
  # pass the browser's Host through — nginx does not unless you add
  # `proxy_set_header Host $host;`. Without this the cross-origin guard sees an Origin that
  # can never match the Host it was given and refuses every save, with
  # "Cross-origin request rejected". Listing the real address here fixes that and still
  # rejects every other origin.
  # trusted_origins:
  #   - https://ipmi.example.com

auth:
  # Whether authentication is on, and the lockout thresholds, are NOT configured here.
  # Authentication is switched on or off from the Security settings and the answer is kept
  # in the database, so a file with write access cannot be used to turn the login off.
  session_expiry: 24h

ipmi:
  poll_interval: 30           # seconds
  power_poll_interval: 30     # seconds
  command_timeout: 30         # seconds
  # Let the web UI install ipmitool when it is missing. Works only when IPMIDeck runs as root
  # (or with sudo that needs no password); otherwise the UI shows the command to run.
  auto_install_ipmitool: false

data:
  retention_days: 365

logging:
  level: info                 # debug, info, warning, error

updates:
  # Master switch for the update check. With this false IPMIDeck never opens a socket to look up
  # a published version: the check endpoint is not registered and the periodic check is not
  # started, whatever was answered during setup. With it true the unattended check is on by
  # default: it runs unless the operator unticked it in the setup wizard or turned off the
  # Updates toggle in Settings. The on-demand button and the console update key are explicit
  # requests and work whenever this is true.
  # Environment override: IPMIDECK_UPDATES_ENABLED=false
  enabled: true
  # Docker only: a Watchtower running next to the container, with its HTTP API on. With both set,
  # "Download and install" in the web UI asks it to replace the container; without them the UI
  # shows the docker compose command instead. A container cannot update its own image.
  # Environment overrides: IPMIDECK_UPDATES_WATCHTOWER_URL, IPMIDECK_UPDATES_WATCHTOWER_TOKEN
  # watchtower_url: http://watchtower:8080
  # watchtower_token: change-me

modules:
  sensors:
    enabled: true
  fanpilot:
    enabled: true
  power:
    enabled: true
  sel:
    enabled: true
  fru:
    enabled: true
