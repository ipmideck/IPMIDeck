name: ci
on:
  push:
    branches: [main, dev] # branches-only: tag pushes excluded — the gate suite runs once per release, via release.yml
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # superseded pushes to the same ref cancel the older run
permissions:
  contents: read
jobs:
  gate:
    uses: ./.github/workflows/gate.yml   # no timeout-minutes here: reusable-call jobs don't accept it (cap lives in gate.yml)

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=0.0.0-ci
            REVISION=${{ github.sha }}
