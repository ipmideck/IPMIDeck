name: release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run: build wheel + image (push:false), skip all publish jobs"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # a release run must never be cancelled mid-publish

permissions:
  contents: read

jobs:
  guard:                 # D-16: tag must match branding._VERSION_FALLBACK (push only)
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Tag matches branding._VERSION_FALLBACK
        run: |
          TAG="${GITHUB_REF_NAME#v}"          # v2.0.0 -> 2.0.0
          LIT="$(python -c 'import ast,pathlib; \
            src=pathlib.Path("backend/core/branding.py").read_text(encoding="utf-8"); \
            t=ast.parse(src); \
            print(next(n.value.value for n in ast.walk(t) \
              if isinstance(n,ast.Assign) \
              and any(getattr(x,"id",None)=="_VERSION_FALLBACK" for x in n.targets)))')"
          echo "tag=$TAG literal=$LIT"
          test "$TAG" = "$LIT"                  # fail the release on drift

  tests:
    uses: ./.github/workflows/gate.yml

  # ---- dispatch dry-run (push:false, publishes nothing) — D-08 ----
  dryrun-build:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
        working-directory: frontend
      - run: npm run build            # tsc -b && vite build -> frontend/dist
        working-directory: frontend
      - name: Publish fresh SPA into backend/static (the wheel's package-data source)
        run: |
          rm -rf backend/static
          mkdir -p backend/static
          cp -r frontend/dist/. backend/static/
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: python -m pip install --upgrade build
      - run: python -m build           # version from attr: -> _VERSION_FALLBACK ; dist/ gitignored
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: |
            VERSION=0.0.0-dispatch
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- tag-push publish (real) — D-09 gates every publish on event_name == 'push' ----
  pypi:
    # Docker (re-runnable) gates PyPI (immutable). !cancelled() keeps the skip-safe path:
    # dockerhub skipped for a missing DOCKERHUB_TOKEN still yields a pip-only release;
    # dockerhub failed/timed out skips pypi so nothing irreversible is published.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.guard.result == 'success' && needs.tests.result == 'success' && (needs.dockerhub.result == 'success' || needs.dockerhub.result == 'skipped') }}
    needs: [guard, tests, dockerhub]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write     # OIDC / Trusted Publishing — no secret
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
        working-directory: frontend
      - run: npm run build            # tsc -b && vite build -> frontend/dist
        working-directory: frontend
      - name: Publish fresh SPA into backend/static (the wheel's package-data source)
        run: |
          rm -rf backend/static
          mkdir -p backend/static
          cp -r frontend/dist/. backend/static/
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: python -m pip install --upgrade build
      - run: python -m build           # version comes from attr: -> _VERSION_FALLBACK
      - run: python scripts/check-wheel.py   # SPA/migrations/version gate BEFORE the immutable publish
      - uses: pypa/gh-action-pypi-publish@release/v1   # zero-config with id-token: write, dist/ default

  # ---- Docker Hub (D-01..D-04) — skip-safe when secrets.DOCKERHUB_TOKEN absent ----
  dockerhub-preflight:
    if: ${{ github.event_name == 'push' }}
    needs: [guard, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}   # secret allowed in env:, not in job if:
        run: |
          if [ -n "$TOKEN" ]; then
            echo "has_token=true"  >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

  dockerhub:
    needs: [dockerhub-preflight]
    if: ${{ needs.dockerhub-preflight.outputs.has_token == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40    # a hung QEMU build dies here, not at GitHub's 6 h hard limit
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          username: devluigi06            # public handle — hardcode OK (D-02)
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: devluigi06/ipmideck
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest
      # Smoke gate: native-amd64 build (no QEMU) that both gates the multi-arch push
      # AND warms the gha layer cache the push step reuses.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: smoke:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test — boot the image, /api/health must answer, the package must carry the tag's version
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 3000:3000 -e IPMIDECK_DEMO=true smoke:ci
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" = 1 ]; then
            # /api/health discloses liveness only, so the version is read from the installed
            # package inside the container.
            v=$(docker exec smoke python -c 'from backend.core.branding import VERSION; print(VERSION)') || ok=0
            echo "package version=${v:-} expected=${GITHUB_REF_NAME#v}"
            [ "${v:-}" = "${GITHUB_REF_NAME#v}" ] || ok=0
          fi
          if [ "$ok" != 1 ]; then
            echo "::error::smoke test failed — /api/health unreachable or version mismatch"
            docker logs smoke || true
            docker rm -f smoke || true
            exit 1
          fi
          docker rm -f smoke
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sync Docker Hub description (needs read/write/delete PAT — Pitfall 3)
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: devluigi06
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: devluigi06/ipmideck
          readme-filepath: ./README.md

  # ---- Draft GitHub Release (D-10) — body from CHANGELOG.md, user presses Publish ----
  release-draft:
    # Draft is created LAST: only after pypi succeeded and dockerhub succeeded-or-skipped
    # (skipped = missing DOCKERHUB_TOKEN, still a valid pip-only release — hence !cancelled()).
    if: ${{ !cancelled() && github.event_name == 'push' && needs.pypi.result == 'success' && (needs.dockerhub.result == 'success' || needs.dockerhub.result == 'skipped') }}
    needs: [guard, tests, pypi, dockerhub]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write            # required to create the release
    steps:
      - uses: actions/checkout@v6
      - name: Slice the CHANGELOG section for this tag into the release body
        run: |
          VER="${GITHUB_REF_NAME#v}"                 # v2.0.1 -> 2.0.1
          # Emit the lines under `## [VER]` up to (not incl.) the next version header or the
          # link-reference block. index()==1 is an exact prefix match, so the [ and . in the
          # version string stay literal (no regex escaping needed).
          awk -v hdr="## [$VER]" '
            index($0, hdr) == 1     { f = 1; next }
            /^## \[/                { f = 0 }
            /^\[.*\]: http/         { f = 0 }
            f
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VER — promote [Unreleased] before tagging."
            exit 1
          fi
          echo "---- release body ----"; cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: true                 # option B: body pre-filled from CHANGELOG, maintainer Publishes
          body_path: release-notes.md
          # tag_name defaults to the pushed tag (github.ref_name)
